apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: node-filesystem-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack

spec:
  groups:
    - name: node-filesystem.rules
      rules:
        - alert: NodeRootFilesystemUsageHigh

          expr: |
            (
              100 *
              (
                1 -
                node_filesystem_avail_bytes{mountpoint="/",fstype!="tmpfs"}
                /
                node_filesystem_size_bytes{mountpoint="/",fstype!="tmpfs"}
              )
            )
            * on(instance) group_left(nodename)
            node_uname_info
            > 65

          for: 10m

          labels:
            severity: warning

          annotations:
            summary: "Root filesystem usage is high on {{ $labels.nodename }}"
            description: "Root filesystem usage on {{ $labels.nodename }} is {{ $value }}%. The warning threshold is 65%. Investigate disk growth before kubelet image garbage collection or storage capacity protections are required."
