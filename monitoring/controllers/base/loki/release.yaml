apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki-stack
  namespace: monitoring
spec:
  interval: 30m
  dependsOn:
    - name: kube-prometheus-stack
  chart:
    spec:
      chart: loki-stack
      version: "2.10.2"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
      interval: 12h
  values:
    loki:
      enabled: true
      persistence:
        enabled: true
        storageClassName: local-path
        # TODO(human): How much disk should Loki use for log storage?
        # Consider: you have 3 nodes, NVMe SSDs — how much can you spare?
        # Common choices: 5Gi (light), 10Gi (moderate), 20Gi (comfortable)
        size: 5Gi
      config:
        limits_config:
          enforce_metric_name: false
          reject_old_samples: true
          # TODO(human): How long should logs be retained?
          # 168h = 7 days | 336h = 14 days | 720h = 30 days
          # Shorter = less disk used. Longer = more debugging history.
          reject_old_samples_max_age: 168h
          retention_period: 168h
        chunk_store_config:
          max_look_back_period: 168h
        table_manager:
          retention_deletes_enabled: true
          retention_period: 168h
    promtail:
      enabled: true
    grafana:
      enabled: false
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: ConfigMap
              name: loki-stack
            patch: |-
              - op: replace
                path: /data/loki-stack-datasource.yaml
                value: |
                  apiVersion: 1
                  datasources:
                  - access: proxy
                    isDefault: false
                    name: Loki
                    type: loki
                    url: "http://loki-stack:3100"
                    version: 1
                    jsonData:
                      {}
