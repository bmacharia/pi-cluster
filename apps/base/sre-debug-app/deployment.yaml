apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-debug-app
  namespace: sre-debug
  labels:
    app: sre-debug-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sre-debug-app
  template:
    metadata:
      labels:
        app: sre-debug-app
    spec:
      containers:
        - name: app
          image: nginxdemos/hello:plain-text
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
              