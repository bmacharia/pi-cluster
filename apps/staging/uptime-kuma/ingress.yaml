apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: uptime-kuma
  namespace: uptime-kuma
spec:
  ingressClassName: traefik
  rules:
    - host: uptime.airmanbabu.net
      http:
        paths:
          - backend:
              service:
                name: linkding
                port:
                  number: 3001
            path: /
            pathType: Prefix
