apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-debug-app
  namespace: sre-debug
spec:
  template:
    spec:
      containers:
        - name: app
          image: python:3.14-alpine
          command: ["python", "-c"]
          args:
            - |
              x = []
              while True:
                  x.append("x" * 1024 * 1024)
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi