apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-debug-app
  namespace: sre-debug
spec:
  template:
    spec:
      containers:
        - name: app
          env: 
            - name: REQUIRED_SETTING
              valueFrom:
                configMapKeyRef:
                  name: sre-debug-config
                  key: required-setting

                  